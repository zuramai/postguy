# Postguy parity checklist vs Postman (offline feature set). Generated from PROMPT.md; maintained
# by hand. Validated and reported by `cargo xtask parity`; schema below.
#
# Status rules: `shipped` = usable today with at least one cited passing test (AGENTS.md 3);
# `partial` = part exists (notes say what is missing); `planned` = not started; `na` = Postman
# cloud-only, with the reason (or the local alternative) in notes. "Shipped" means exists and
# tested, not "as good as Postman".
# `commands` lists registry ids from crates/engine (only once they exist); `tools` lists
# crates/automation tool names (only once they exist); `evidence` cites
# path/to/file.rs::test_name of passing tests.
[schema]
version = 1
statuses = ["planned", "partial", "shipped", "na"]
tiers = ["P0", "P1", "P2", "P3", "N/A"]
areas = { A = "collections", B = "environments-and-variables", C = "http", D = "grpc", E = "websocket", F = "automation", G = "imports-and-exports", H = "ui-shell", I = "platform-packaging" }

