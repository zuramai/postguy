[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/zuramai/postguy"

[workspace.dependencies]
# UI stack (L7 only; enforced by cargo xtask layers). The app pulls eframe with the glow
# backend and egui's default fonts; ui-egui works on plain egui.
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }

# macOS native menu bar and work-area lookup (apps/postguy only; AGENTS.md: permissive licences,
# default-features = false). muda's GTK feature is never enabled, so no LGPL code is linked.
muda = { version = "0.21", default-features = false }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "objc2-core-foundation"] }

# Foundation: key order and number text survive round trips.
postguy-util = { path = "crates/util" }
postguy-model = { path = "crates/model" }
postguy-auth = { path = "crates/auth" }
postguy-urlkit = { path = "crates/urlkit" }
postguy-vars = { path = "crates/vars" }
postguy-interop = { path = "crates/interop" }
postguy-store = { path = "crates/store" }
postguy-automation = { path = "crates/automation" }
postguy-http = { path = "crates/http" }
postguy-script = { path = "crates/script" }
postguy-engine = { path = "crates/engine" }
postguy-snippets = { path = "crates/snippets" }
postguy-ws = { path = "crates/ws" }
postguy-grpc = { path = "crates/grpc" }
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-native-roots"] }
prost = { version = "0.14", default-features = false, features = ["std"] }
prost-reflect = { version = "0.16", default-features = false, features = ["serde"] }
prost-types = { version = "0.14", default-features = false }
tonic-reflection = { version = "0.14", default-features = false }
protox = { version = "0.10", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
postguy-platform = { path = "crates/platform" }
postguy-testkit = { path = "crates/testkit" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }
# IDNA for non-ASCII hosts; licences: Unicode-3.0/MIT/Apache.
idna = { version = "1", default-features = false, features = ["std", "compiled_data"] }
# Pseudo-random text for dynamic variables (MIT/Apache-2.0).
fastrand = "2"
getrandom = "0.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# HTTP: hyper-direct connector; testkit serves the loopback fixtures.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "fs", "macros"] }
hyper = { version = "1", default-features = false, features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["server", "client", "client-legacy", "tokio", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "native-tokio", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = { version = "8", default-features = false, features = ["std"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = { version = "0.22", default-features = false, features = ["std"] }
# Embedded JavaScript (QuickJS, MIT). No `rust-alloc`: it would turn set_memory_limit into a no-op.
rquickjs = { version = "0.14", default-features = false, features = ["std", "properties"] }
http-body-util = "0.1"
tower-service = "0.3"
cookie = { version = "0.18", default-features = false }
bytes = "1"

# Testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

# Dependencies keep only line-table debug info so backtraces still show file and line while
# test binaries stay small; our own crates keep full debug info.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

# Release profile tuned for size. `panic = "unwind"` is required by AGENTS.md 4 so the
# catch_unwind guards work; never set `panic = "abort"`.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "unwind"
