openapi: 3.0.3
info:
  title: Corner Shop
  description: A tiny shop API written for Postguy's own tests.
servers:
  - url: https://{env}.shop.test/v1
    variables:
      env:
        default: api
tags:
  - name: items
    description: Things for sale
  - name: orders
security:
  - bearerAuth: []
x-owner: tests
paths:
  /items:
    get:
      tags: [items]
      summary: List items
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: X-Trace
          in: header
          required: true
          schema:
            type: string
        - name: session
          in: cookie
          schema:
            type: string
            example: abc
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      tags: [items]
      summary: Create an item
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "201":
          description: Created
          content:
            application/json:
              example:
                id: 7
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          example: "42"
    get:
      tags: [items]
      operationId: getItem
      responses:
        "200":
          description: One item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        default:
          description: Something went wrong
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Alive
  /tree:
    post:
      summary: Store a tree
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Node"
      responses:
        "204":
          description: Stored
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Item:
      type: object
      required: [name]
      properties:
        id:
          type: integer
        name:
          type: string
          example: widget
        price:
          type: number
        added:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
    Node:
      type: object
      properties:
        value:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/Node"
