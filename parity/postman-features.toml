# Postguy parity checklist vs Postman (offline feature set). Maintained by
# hand. Validated and reported by `cargo xtask parity`; schema below.
#
# Status rules: `shipped` = usable today with at least one cited passing test (AGENTS.md 3);
# `partial` = part exists (notes say what is missing); `planned` = not started; `na` = Postman
# cloud-only, with the reason (or the local alternative) in notes. "Shipped" means exists and
# tested, not "as good as Postman".
# `commands` lists registry ids from crates/engine (only once they exist); `tools` lists
# crates/automation tool names (only once they exist); `evidence` cites
# path/to/file.rs::test_name of passing tests.
[schema]
version = 1
statuses = ["planned", "partial", "shipped", "na"]
tiers = ["P0", "P1", "P2", "P3", "N/A"]
areas = { A = "collections", B = "environments-and-variables", C = "http", D = "grpc", E = "websocket", F = "automation", G = "imports-and-exports", H = "ui-shell", I = "platform-packaging" }

# ==================================================================================================
# A. Collections and folders
# ==================================================================================================

[[feature]]
id = "a.tree-view"
title = "Collections tree with carets, nesting and method labels"
area = "A"
tier = "P0"
status = "shipped"
notes = "30 px rows with rounded hover/selection fills, painted chevrons, method labels and colours in a 42 px column, examples collapsed until the request caret is used, inline rename, preview-open intents. Favourite star (P1) is not drawn."
evidence = ["crates/ui-egui/tests/sidebar.rs::flatten_orders_collections_folders_requests_examples_and_history", "crates/ui-egui/tests/sidebar.rs::caret_collapses_a_folder_and_expands_request_examples", "crates/ui-egui/tests/sidebar.rs::clicking_a_request_opens_it_as_a_preview"]
[[feature]]
