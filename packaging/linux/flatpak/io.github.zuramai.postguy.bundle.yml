# Flatpak manifest for the single-file bundle attached to every GitHub release
# (postguy-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (postguy-<version>-linux-<arch>.tar.gz, built on
# Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no network and no
# vendored crate sources during the build, and byte-for-byte the same binaries as the
# AppImage/deb/rpm. The script unpacks the tarball into `stage/` next to a copy of this file and
# copies postguy-flatpak (the launcher) there too. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and EGL at runtime; the freedesktop runtime has all of them, and the GPU
# driver comes from its org.freedesktop.Platform.GL extension.
#
# io.github.zuramai.postguy.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: io.github.zuramai.postguy
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: postguy-flatpak
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the OpenGL renderer.
  - --device=dri
  # Postguy is an API client: requests the user sends need the network. Nothing else uses it
  # (no telemetry, no update check).
  - --share=network
  # Deliberately not granted: any filesystem access. Open/Save dialogs go through the file-chooser
  # portal (rfd's xdg-portal backend), so files and workspace folders the user picks work anywhere.
  # The default workspace lives in the app's own data directory (see postguy-flatpak).
modules:
  - name: postguy
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/postguy /app/bin/postguy
      - install -Dm755 bin/postguy-cli /app/bin/postguy-cli
      - install -Dm755 postguy-flatpak /app/bin/postguy-flatpak
      # Flatpak exports the desktop file's Exec as `--command=<first word>`, so point it at the launcher.
      - install -Dm644 share/applications/io.github.zuramai.postguy.desktop /app/share/applications/io.github.zuramai.postguy.desktop
      - sed -i 's/^Exec=postguy$/Exec=postguy-flatpak/;/^TryExec=/d' /app/share/applications/io.github.zuramai.postguy.desktop
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.zuramai.postguy.metainfo.xml /app/share/metainfo/io.github.zuramai.postguy.metainfo.xml
      # Licences, including the Poppins font's OFL text.
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/postguy /app/share/doc/
    sources:
      - type: dir
        path: stage
