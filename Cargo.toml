[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/postguy/postguy"

[workspace.dependencies]
# UI stack (L7 only; enforced by cargo xtask layers). The app pulls eframe with the glow
# backend and egui's default fonts; ui-egui works on plain egui.
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }

# Foundation (PROMPT.md 4.2): key order and number text survive round trips.
postguy-util = { path = "crates/util", version = "0.1.0" }
postguy-model = { path = "crates/model", version = "0.1.0" }
postguy-urlkit = { path = "crates/urlkit", version = "0.1.0" }
postguy-vars = { path = "crates/vars", version = "0.1.0" }
postguy-interop = { path = "crates/interop", version = "0.1.0" }
postguy-store = { path = "crates/store", version = "0.1.0" }
postguy-automation = { path = "crates/automation", version = "0.1.0" }
postguy-http = { path = "crates/http", version = "0.1.0" }
postguy-engine = { path = "crates/engine", version = "0.1.0" }
postguy-testkit = { path = "crates/testkit", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }
# IDNA for non-ASCII hosts (PROMPT.md Appendix D); licences: Unicode-3.0/MIT/Apache.
idna = { version = "1", default-features = false, features = ["std", "compiled_data"] }
# Pseudo-random text for dynamic variables (MIT/Apache-2.0).
fastrand = "2"

# HTTP (PROMPT.md 4.2): hyper-direct connector; testkit serves the loopback fixtures.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "fs", "macros"] }
hyper = { version = "1", default-features = false, features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["server", "client", "client-legacy", "tokio", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "native-tokio", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = { version = "8", default-features = false, features = ["std"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = { version = "0.22", default-features = false, features = ["std"] }
http-body-util = "0.1"
tower-service = "0.3"
cookie = { version = "0.18", default-features = false }
bytes = "1"

# Testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

# Dependencies keep only line-table debug info so backtraces still show file and line while
# test binaries stay small; our own crates keep full debug info.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

# Release profile per PROMPT.md 8. `panic = "unwind"` is required by AGENTS.md 4 so the
# catch_unwind guards work; never set `panic = "abort"`.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "unwind"
