# Asset attribution (AGENTS.md 1.3): the single source of truth.
# `cargo xtask assets --write` regenerates ATTRIBUTION.md from this and verifies every
# SHA-256, licence and licence file. Add an entry here BEFORE committing an asset, and run
# the gate. `postman_data = true` entries are on a closed list approved by the owner only.

# ==========================================================================================
# Committed assets ([[asset]]): files in this repository.
# ==========================================================================================

# (contributor-original entries are added as the project creates assets: the M0.5 logo,
# the first Lucide icons used by the M0.3 icon spike, demo collections, word lists.)

# ==========================================================================================
# Bundled by Cargo dependencies ([[bundled]]): files a crates.io dependency compiles into
# Postguy. egui's default fonts (v1 uses them per AGENTS.md 1.4; no font files are committed).
# ==========================================================================================

